
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Hospital Contact | AI Smart Hospital Contact Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="container">

        <h1>AI Smart Hospital Contact Manager</h1>
        <p class="subtitle">
            Add doctors, hospitals, clinics, and healthcare providers
        </p>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Add Hospital Contact Form -->
        <form method="POST" action="{{ url_for('add_contact') }}">

            <label for="name">Full Name *</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="e.g. Dr. Ananya Kumar"
                value="{{ request.form.get('name', '') }}"
                maxlength="100"
                required
            >

            <label for="email">Email Address *</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="e.g. doctor@example.com"
                value="{{ request.form.get('email', '') }}"
                maxlength="254"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="e.g. 9876543210"
                value="{{ request.form.get('phone', '') }}"
                maxlength="20"
            >

            <label for="company">Organization (Optional)</label>
            <input
                type="text"
                id="company"
                name="company"
                placeholder="e.g. Healthcare Services"
                value="{{ request.form.get('company', '') }}"
                maxlength="150"
            >

            <label for="category">Contact Type *</label>
            <select id="category" name="category" required>

                {% for contact_type in [
                    'Doctor',
                    'Hospital',
                    'Clinic',
                    'Healthcare Provider',
                    'Other'
                ] %}

                    <option
                        value="{{ contact_type }}"
                        {% if request.form.get('category', 'Doctor') == contact_type %}
                            selected
                        {% endif %}
                    >
                        {{ contact_type }}
                    </option>

                {% endfor %}

            </select>

            <label for="hospital_name">Hospital / Clinic Name</label>
            <input
                type="text"
                id="hospital_name"
                name="hospital_name"
                placeholder="e.g. Green Valley Hospital"
                value="{{ request.form.get('hospital_name', '') }}"
                maxlength="150"
            >

            <label for="department">Department / Specialization</label>
            <input
                type="text"
                id="department"
                name="department"
                placeholder="e.g. Cardiology, Pediatrics, Neurology"
                value="{{ request.form.get('department', '') }}"
                maxlength="100"
            >

            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="e.g. Chennai, Tamil Nadu"
                value="{{ request.form.get('location', '') }}"
                maxlength="150"
            >

            <label for="notes">Notes</label>
            <textarea
                id="notes"
                name="notes"
                rows="4"
                placeholder="Enter contact notes or appointment enquiry information"
                maxlength="1000"
            >{{ request.form.get('notes', '') }}</textarea>

            <button type="submit">
                Save Hospital Contact
            </button>

        </form>

    </main>

</body>
</html>
